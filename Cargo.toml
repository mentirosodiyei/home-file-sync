[workspace]
resolver = "2"
members = ["crates/sfs-core", "crates/sfs-cli", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mentirosodiyei/home-file-sync"
rust-version = "1.82"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
