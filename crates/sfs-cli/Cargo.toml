[package]
name = "sfs-cli"
description = "Show File Sync sin interfaz gráfica (servidores, pruebas y diagnóstico)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "showfilesync-cli"
path = "src/main.rs"

[dependencies]
sfs-core = { path = "../sfs-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
